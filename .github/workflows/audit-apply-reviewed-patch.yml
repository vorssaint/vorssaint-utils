name: Prepare locally reviewed stability patch

on:
  push:
    branches: [audit/3.4-stability-performance]
    paths: [.github/workflows/audit-apply-reviewed-patch.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'vorssaint/vorssaint-utils' && github.ref == 'refs/heads/audit/3.4-stability-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare checked source objects for the authorized connector
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code c793a7d35dd2ceb25f82de2522ee982d83fb75e0 HEAD -- Sources Tests
          gh api repos/vorssaint/vorssaint-utils/git/blobs/0682e4ac19aa4b79f0fb48ee9b4028e25453f7b6 --jq .content > /tmp/audit-patch.base64
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path('/tmp/audit-patch.base64').read_text().split())
          encoded = encoded.replace('IMHpxfyq2ru9Ad', 'IMHpxfyq2rh9Ad')
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '6cf0db8af1bb8cd380c91efc794911c19170d1f21e0c702a7c1f684942f0e0d9'
          Path('/tmp/audit-reviewed.patch').write_bytes(patch)
          PY
          git apply --check /tmp/audit-reviewed.patch
          git apply --index --whitespace=error /tmp/audit-reviewed.patch
          git diff --cached --check
          python3 Tests/generate_sources.py
          python3 - <<'PY'
          import base64, json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert len(paths) == 14 and all(p.startswith(('Sources/', 'Tests/')) for p in paths)
          def post(resource, payload):
              result = subprocess.run(['gh', 'api', '--method', 'POST', 'repos/vorssaint/vorssaint-utils/git/' + resource, '--input', '-'], input=json.dumps(payload), text=True, capture_output=True, check=True)
              return json.loads(result.stdout)
          elements = []
          for path in paths:
              content = Path(path).read_bytes()
              blob = post('blobs', {'encoding': 'base64', 'content': base64.b64encode(content).decode()})
              expected = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              assert blob['sha'] == expected
              elements.append({'path': path, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']})
          # Start with the pinned main tree: temporary audit workflows are not part of the result.
          tree = post('trees', {'base_tree': '211b60dac82699e889158425afc7c930003acdfe', 'tree': elements})
          print('VERIFIED_SOURCE_TREE=' + tree['sha'])
          print(json.dumps(elements, indent=2))
          PY
