name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Unit tests
        run: ./build.sh --test

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

  build:
    name: Build & selftest
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Unit tests
        run: ./build.sh --test

      - name: Set up signing
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: ./Tools/ci-setup-signing.sh

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Vorssaint-dmg
          path: dist/*.dmg
          if-no-files-found: error
